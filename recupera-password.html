<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://zkwwxxmbikxpzedcmjxx.supabase.co; form-action 'none'; base-uri 'none'"><title>Reimposta password | Canicattì Partecipa</title><style>body{font:17px/1.6 system-ui,sans-serif;margin:0;background:#eef3f8;color:#17304d}main{max-width:480px;margin:8vh auto;padding:32px;background:white;border-radius:18px;box-shadow:0 8px 32px #17304d18}h1{font-size:26px;line-height:1.25}label{display:block;margin-top:20px;font-weight:600}input,button{box-sizing:border-box;width:100%;padding:13px;font:inherit;border-radius:8px;border:1px solid #bdc9d5}button{margin-top:24px;background:#174b7a;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}a{color:#174b7a}[hidden]{display:none!important}#message{min-height:28px}@media(max-width:560px){main{margin:24px 16px;padding:24px}}</style></head><body><main><p>CANICATTÌ PARTECIPA</p><h1>Reimposta la password</h1><p id="intro">Verifica del link di recupero…</p><form id="resetForm" hidden><label for="password">Nuova password</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm">Conferma nuova password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><p>Usa almeno 12 caratteri. Questa password serve per il pannello di Canicattì Partecipa.</p><button id="submit" type="submit">Salva nuova password</button></form><p id="message" role="status" aria-live="polite"></p><a id="login" href="admin.html" hidden>Vai al pannello amministratore</a></main><script>
'use strict';
const BASE='https://zkwwxxmbikxpzedcmjxx.supabase.co';
const KEY='sb_publishable_5usTyC1lIfP6ykIY456Glw_iJdy6NvP';
const READER='e6712a60-873b-446b-90ea-5c6811d2b346';
const params=new URLSearchParams(location.hash.slice(1));
let recoveryToken=params.get('access_token');
const recoveryType=params.get('type');
const linkError=params.get('error_description')||new URLSearchParams(location.search).get('error_description');
history.replaceState(null,'',location.pathname);
const intro=document.getElementById('intro'),form=document.getElementById('resetForm'),message=document.getElementById('message'),submit=document.getElementById('submit'),login=document.getElementById('login');
const headers=()=>({apikey:KEY,Authorization:'Bearer '+recoveryToken,'Content-Type':'application/json'});
async function checkLink(){
 try{
  if(linkError||!recoveryToken||recoveryType!=='recovery')throw new Error();
  const r=await fetch(BASE+'/auth/v1/user',{headers:headers(),signal:AbortSignal.timeout(15000)});
  if(!r.ok)throw new Error();const user=await r.json();
  if(user.id!==READER)throw new Error();
  intro.textContent='Scegli la nuova password per l’account controcorrentefarocanicatti@gmail.com.';form.hidden=false;
 }catch(_){recoveryToken=null;intro.textContent='Il link non è valido oppure è scaduto. Richiedi un nuovo recupero per Canicattì Partecipa.';login.hidden=false;}
}
form.addEventListener('submit',async event=>{
 event.preventDefault();if(submit.disabled||!recoveryToken)return;
 const password=document.getElementById('password').value,confirmation=document.getElementById('confirm').value;
 if(password.length<12){message.textContent='Usa almeno 12 caratteri.';return;}
 if(password!==confirmation){message.textContent='Le due password non coincidono.';return;}
 submit.disabled=true;message.textContent='Salvataggio in corso…';
 try{
  // Ricontrolla sul server l’identità della sessione prima di modificare la password.
  const identity=await fetch(BASE+'/auth/v1/user',{headers:headers(),signal:AbortSignal.timeout(15000)});
  if(!identity.ok||(await identity.json()).id!==READER)throw new Error();
  const r=await fetch(BASE+'/auth/v1/user',{method:'PUT',headers:headers(),body:JSON.stringify({password}),signal:AbortSignal.timeout(15000)});
  if(!r.ok){let d={};try{d=await r.json();}catch(_){}message.textContent=d.code==='same_password'?'Scegli una password diversa dalla precedente.':d.code==='weak_password'?'La password non soddisfa i requisiti di sicurezza. Scegline una più robusta.':'Salvataggio non riuscito. Il link potrebbe essere scaduto: richiedi un nuovo recupero.';return;}
  form.reset();form.hidden=true;intro.textContent='Password aggiornata.';message.textContent='Ora puoi accedere al pannello con email e nuova password.';login.hidden=false;
  try{await fetch(BASE+'/auth/v1/logout',{method:'POST',headers:headers(),signal:AbortSignal.timeout(10000)});}catch(_){}
  recoveryToken=null;
 }catch(_){message.textContent='Connessione non disponibile o sessione scaduta. Riprova o richiedi un nuovo recupero.';}
 finally{submit.disabled=false;}
});
checkLink();
</script></body></html>
